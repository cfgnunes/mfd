name: CI

on:
  push:
  pull_request:


jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v4
      with:
        miniforge-version: latest
        activate-environment: mfd
        environment-file: environment.yml

    - name: Test the project
      shell: bash -el {0}
      run: jupyter nbconvert --to notebook --inplace --execute *.ipynb
